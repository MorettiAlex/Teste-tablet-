<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelos de Moluscos para Imprimir</title>
    <style>
        /* Configurações de página para impressão A4 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f0f0f0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        /* Container que simula a folha A4 */
        .pagina-a4 {
            background: white;
            width: 210mm;
            height: 297mm;
            padding: 20mm;
            margin: 10mm auto;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            page-break-after: always; /* Força o corte de página na impressão */
            position: relative;
        }

        /* Cabeçalho pedagógico */
        .cabecalho {
            width: 100%;
            border-bottom: 2px dashed #000;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        .cabecalho h1 {
            font-size: 24px;
            text-align: center;
            text-transform: uppercase;
        }
        .cabecalho .info-aluno {
            margin-top: 15px;
            font-size: 14px;
            display: flex;
            justify-content: space-between;
        }

        /* Área do desenho */
        .area-desenho {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            position: relative;
        }

        /* Legenda inferior */
        .legenda {
            text-align: center;
            margin-top: 20px;
            border-top: 1px solid #eee;
            padding-top: 10px;
            width: 100%;
        }
        .legenda h2 {
            font-size: 28px;
            letter-spacing: 2px;
        }
        .legenda p {
            font-size: 14px;
            color: #555;
            margin-top: 5px;
        }

        /* ========================================================
           ARTE EM CSS (Estrutura dos Moluscos - Estilo Linha/Traço)
           ======================================================== */
        
        .molusco-arte {
            position: relative;
            border: 2px transparent solid;
        }

        /* 1. POLVO */
        .polvo {
            width: 300px;
            height: 300px;
        }
        .polvo .cabeca {
            width: 140px;
            height: 140px;
            border: 4px solid #000;
            border-radius: 50%;
            position: absolute;
            top: 20px;
            left: 80px;
            background: #fff;
        }
        .polvo .olho {
            width: 20px;
            height: 20px;
            border: 3px solid #000;
            border-radius: 50%;
            position: absolute;
            top: 60px;
            background: #fff;
        }
        .polvo .olho.esq { left: 30px; }
        .polvo .olho.dir { right: 30px; }
        .polvo .olho::after {
            content: '';
            width: 6px;
            height: 6px;
            background: #000;
            border-radius: 50%;
            position: absolute;
            top: 4px;
            left: 4px;
        }
        .polvo .sorriso {
            width: 30px;
            height: 15px;
            border-bottom: 3px solid #000;
            border-radius: 0 0 15px 15px;
            position: absolute;
            top: 90px;
            left: 55px;
        }
        /* Tentáculos do Polvo */
        .polvo .tentaculo {
            width: 40px;
            height: 100px;
            border: 4px solid #000;
            border-top: none;
            border-radius: 0 0 20px 20px;
            position: absolute;
            top: 150px;
            background: #fff;
        }
        .polvo .t1 { left: 40px; transform: rotate(20deg); }
        .polvo .t2 { left: 90px; height: 120px; }
        .polvo .t3 { left: 140px; height: 120px; }
        .polvo .t4 { left: 190px; transform: rotate(-20deg); }

        /* 2. LULA */
        .lula {
            width: 300px;
            height: 350px;
        }
        .lula .corpo {
            width: 100px;
            height: 180px;
            border: 4px solid #000;
            border-radius: 50% 50% 20% 20% / 80% 80% 20% 20%;
            position: absolute;
            top: 40px;
            left: 100px;
            background: #fff;
            z-index: 2;
        }
        .lula .barbatana {
            width: 0;
            height: 0;
            border-left: 50px solid transparent;
            border-right: 50px solid transparent;
            border-bottom: 70px solid #000;
            position: absolute;
            top: 20px;
            left: 100px;
        }
        .lula .barbatana::after {
            content: '';
            position: absolute;
            width: 0;
            height: 0;
            border-left: 44px solid transparent;
            border-right: 44px solid transparent;
            border-bottom: 62px solid #fff;
            top: 6px;
            left: -44px;
        }
        .lula .olho {
            width: 18px;
            height: 18px;
            border: 3px solid #000;
            border-radius: 50%;
            position: absolute;
            bottom: 30px;
            background: #fff;
        }
        .lula .olho.esq { left: 20px; }
        .lula .olho.dir { right: 20px; }
        .lula .tentaculo-longo {
            width: 16px;
            height: 140px;
            border: 4px solid #000;
            border-top: none;
            border-radius: 0 0 8px 8px;
            position: absolute;
            top: 210px;
            background: #fff;
        }
        .lula .tl1 { left: 110px; }
        .lula .tl2 { left: 160px; }

        /* 3. CARACOL */
        .caracol {
            width: 350px;
            height: 250px;
        }
        .caracol .corpo-lesma {
            width: 260px;
            height: 50px;
            border: 4px solid #000;
            border-radius: 30px;
            position: absolute;
            bottom: 30px;
            left: 20px;
            background: #fff;
        }
        .caracol .concha {
            width: 160px;
            height: 160px;
            border: 4px solid #000;
            border-radius: 50%;
            position: absolute;
            bottom: 60px;
            left: 60px;
            background: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        /* Espiral interna da concha */
        .caracol .espiral-1 {
            width: 110px;
            height: 110px;
            border: 4px solid #000;
            border-radius: 50%;
            border-bottom-color: transparent;
            transform: rotate(45deg);
        }
        .caracol .antena {
            width: 4px;
            height: 40px;
            background: #000;
            position: absolute;
            bottom: 70px;
            left: 240px;
            transform-origin: bottom center;
        }
        .caracol .antena.a1 { transform: rotate(-15deg); left: 240px;}
        .caracol .antena.a2 { transform: rotate(15deg); left: 255px;}
        .caracol .antena::before {
            content: '';
            width: 12px;
            height: 12px;
            border: 3px solid #000;
            background: #fff;
            border-radius: 50%;
            position: absolute;
            top: -10px;
            left: -4px;
        }

        /* 4. LESMA */
        .lesma {
            width: 350px;
            height: 200px;
        }
        .lesma .base {
            width: 280px;
            height: 60px;
            border: 4px solid #000;
            border-radius: 50% 50% 40% 40% / 100% 100% 30% 30%;
            position: absolute;
            bottom: 20px;
            left: 30px;
            background: #fff;
        }
        .lesma .antena-lesma {
            width: 4px;
            height: 45px;
            background: #000;
            position: absolute;
            top: 45px;
            left: 270px;
        }
        .lesma .al1 { transform: rotate(10deg); left: 270px; }
        .lesma .al2 { transform: rotate(-10deg); left: 285px; }
        .lesma .antena-lesma::before {
            content: '';
            width: 14px;
            height: 14px;
            border: 3px solid #000;
            background: #fff;
            border-radius: 50%;
            position: absolute;
            top: -12px;
            left: -5px;
        }
        .lesma .olho-ponto {
            width: 6px;
            height: 6px;
            background: #000;
            border-radius: 50%;
            position: absolute;
            top: 85px;
            left: 260px;
        }

        /* Oculta os fundos cinzas e margens da tela na hora de imprimir */
        @media print {
            body { background: white; }
            .pagina-a4 {
                margin: 0;
                box-shadow: none;
                page-break-after: always;
            }
        }
    </style>
</head>
<body>

    <!-- PÁGINA 1: POLVO -->
    <div class="pagina-a4">
        <div class="cabecalho">
            <h1>Estudo dos Moluscos • Ciências</h1>
            <div class="info-aluno">
                <span><strong>Aluno(a):</strong> ________________________________________</span>
                <span><strong>Data:</strong> ____/____/2026</span>
            </div>
        </div>
        <div class="area-desenho">
            <div class="molusco-arte polvo">
                <div class="cabeca">
                    <div class="olho esq"></div>
